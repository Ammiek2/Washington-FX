<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Washington FX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#07101c;
    color:#fff;
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   AUTH
========================= */

.auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        linear-gradient(
            135deg,
            #07101c,
            #10243b
        );
}

.auth-box{
    width:100%;
    max-width:420px;
    background:#0d1b2a;
    border:1px solid #203b55;
    border-radius:16px;
    padding:28px;
    box-shadow:
        0 20px 60px rgba(0,0,0,.4);
}

.logo{
    font-size:27px;
    font-weight:800;
    text-align:center;
    margin-bottom:8px;
}

.sub{
    text-align:center;
    color:#91a5b9;
    margin-bottom:25px;
}

.auth-box input{
    width:100%;
    margin:7px 0;
    padding:13px;
    border-radius:8px;
    border:1px solid #29445e;
    background:#071522;
    color:white;
}

.primary{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#1687f7;
    color:white;
    font-weight:bold;
}

.primary:hover{
    background:#2195ff;
}

.secondary{
    background:#172b3e;
    color:white;
    border:1px solid #2d4b65;
    border-radius:7px;
    padding:9px 13px;
}

.secondary:hover{
    background:#203b55;
}

.auth-message{
    min-height:22px;
    margin-top:10px;
    color:#ffd166;
    text-align:center;
}

/* =========================
   APPLICATION
========================= */

.app{
    display:none;
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:230px;
    background:#081522;
    border-right:1px solid #1b334a;
    padding:20px 12px;
    z-index:10;
}

.brand{
    font-size:22px;
    font-weight:800;
    padding:8px 10px 22px;
}

.nav button{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    color:#9db0c3;
    border:0;
    padding:12px;
    margin:3px 0;
    border-radius:7px;
}

.nav button:hover,
.nav button.active{
    background:#14304a;
    color:#fff;
}

.logout{
    position:absolute;
    bottom:20px;
    left:12px;
    width:calc(100% - 24px);
    padding:11px;
    background:#351b22;
    color:#ff9da8;
    border:1px solid #66313b;
    border-radius:7px;
}

.main{
    margin-left:230px;
    min-height:100vh;
}

.topbar{
    min-height:65px;
    background:#0a1725;
    border-bottom:1px solid #1b334a;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:12px 20px;
}

.mode-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.mode-buttons button{
    padding:9px 15px;
    border:1px solid #2a4760;
    background:#102336;
    color:#a8b9c9;
    border-radius:7px;
}

.mode-buttons button.active{
    background:#146fba;
    color:white;
}

.status{
    font-size:13px;
    color:#6ee7a2;
}

/* =========================
   PAGES
========================= */

.page{
    display:none;
    padding:20px;
}

.page.active{
    display:block;
}

/* =========================
   CARDS
========================= */

.cards{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:12px;
    margin-bottom:15px;
}

.card{
    background:#0d1b2a;
    border:1px solid #1e374f;
    border-radius:10px;
    padding:16px;
}

.card-title{
    color:#8197aa;
    font-size:12px;
    margin-bottom:7px;
}

.card-value{
    font-size:20px;
    font-weight:bold;
}

/* =========================
   TRADING
========================= */

.trading-grid{
    display:grid;
    grid-template-columns:
        minmax(0,1fr) 340px;
    gap:15px;
}

.panel{
    background:#0d1b2a;
    border:1px solid #1e374f;
    border-radius:10px;
    padding:15px;
}

.panel-title{
    font-weight:bold;
    margin-bottom:12px;
}

.chart-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.instrument{
    font-size:18px;
    font-weight:bold;
}

.market-price{
    color:#7ee7ff;
    font-size:18px;
    margin-top:4px;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin:8px 0;
}

.toolbar button{
    border:1px solid #29445e;
    background:#102236;
    color:#aebfd0;
    border-radius:5px;
    padding:6px 9px;
    font-size:12px;
}

.toolbar button.active{
    background:#146fba;
    color:#fff;
}

#chart{
    width:100%;
    height:480px;
    border:1px solid #183149;
    border-radius:7px;
    overflow:hidden;
}

/* =========================
   FORMS
========================= */

.form-row{
    margin-bottom:10px;
}

.form-row label{
    display:block;
    color:#91a5b9;
    font-size:12px;
    margin-bottom:5px;
}

.form-row input,
.form-row select{
    width:100%;
    background:#071522;
    border:1px solid #29445e;
    color:white;
    padding:10px;
    border-radius:6px;
}

.form-row input:disabled{
    opacity:.7;
}

.order-types{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);
    gap:5px;
}

.order-types button{
    padding:8px 4px;
    background:#102236;
    color:#9eb1c3;
    border:1px solid #29445e;
    border-radius:5px;
    font-size:11px;
}

.order-types button.active{
    background:#176da9;
    color:#fff;
}

.buy-sell{
    display:grid;
    grid-template-columns:
        1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.buy{
    padding:13px;
    background:#087f5b;
    color:white;
    border:0;
    border-radius:7px;
    font-weight:bold;
}

.buy:hover{
    background:#099c70;
}

.sell{
    padding:13px;
    background:#b938
