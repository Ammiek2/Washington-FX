<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Washington FX Login</title>

    <style>
        body {
            margin: 0;
            background: #07101c;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 400px;
            margin: 100px auto;
            padding: 25px;
            background: #101c2b;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            box-sizing: border-box;
            background: #07101c;
            color: white;
            border: 1px solid #40536b;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: #1687ff;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            font-size: 16px;
        }

        .link {
            text-align: center;
            margin-top: 20px;
            color: #55aaff;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>WASHINGTON FX</h1>

    <p style="text-align:center;">
        Login to your account
    </p>

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">
        LOGIN
    </button>

    <div id="message"></div>

    <div class="link">
        <a href="register.html" style="color:#55aaff;">
            Create Account
        </a>
    </div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
    "https://plddteltleqayzcpuxom.supabase.co",
    "sb_publishable_jX6_GQggT_GD2Kv_jNBcqA_frXVuZWv"
);

window.login = async function() {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if (!email || !password) {
        message.innerHTML =
            "Enter email and password.";
        return;
    }

    const { error } =
        await supabase.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        message.innerHTML =
            error.message;

        return;
    }

    window.location.href =
        "dashboard.html";
};

</script>

</body>
</html>
