<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Washington FX Register</title>

    <style>
        body {
            margin: 0;
            background: #07101c;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 400px;
            margin: 70px auto;
            padding: 25px;
            background: #101c2b;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            box-sizing: border-box;
            background: #07101c;
            color: white;
            border: 1px solid #40536b;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: #1687ff;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            font-size: 16px;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>WASHINGTON FX</h1>

    <p style="text-align:center;">
        Create your account
    </p>

    <input
        type="text"
        id="name"
        placeholder="Full Name"
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <input
        type="password"
        id="confirm"
        placeholder="Confirm Password"
    >

    <button onclick="register()">
        CREATE ACCOUNT
    </button>

    <div id="message"></div>

    <div class="link">
        <a href="login.html" style="color:#55aaff;">
            Already have an account? Login
        </a>
    </div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
    "https://plddteltleqayzcpuxom.supabase.co",
    "sb_publishable_jX6_GQggT_GD2Kv_jNBcqA_frXVuZWv"
);

window.register = async function() {

    const name =
        document.getElementById("name").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const confirm =
        document.getElementById("confirm").value;

    const message =
        document.getElementById("message");

    if (!name || !email || !password) {
        message.innerHTML =
            "Please complete all fields.";
        return;
    }

    if (password !== confirm) {
        message.innerHTML =
            "Passwords do not match.";
        return;
    }

    const { error } =
        await supabase.auth.signUp({

            email: email,

            password: password,

            options: {
                data: {
                    full_name: name
                }
            }

        });

    if (error) {

        message.innerHTML =
            error.message;

        return;
    }

    message.innerHTML =
        "Account created. You can now login.";

};

</script>

</body>
</html>
