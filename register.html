<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Washington FX - Create Account</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: #07101c;
    color: #fff;
}

.box {
    width: 92%;
    max-width: 420px;
    background: #101c2b;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 15px 50px rgba(0,0,0,.45);
}

.logo {
    text-align: center;
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #91a4b8;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border: 1px solid #30445c;
    border-radius: 8px;
    background: #07101c;
    color: #fff;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: 0;
    border-radius: 8px;
    background: #1687ff;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

.link {
    text-align: center;
    margin-top: 20px;
    color: #55aaff;
    cursor: pointer;
}

.message {
    text-align: center;
    margin-top: 15px;
    line-height: 1.4;
}

.error {
    color: #ff7070;
}

.success {
    color: #42df91;
}

</style>

</head>

<body>

<div class="box">

    <div class="logo">
        WASHINGTON FX
    </div>

    <div class="subtitle">
        Create Your Account
    </div>

    <input
        id="name"
        type="text"
        placeholder="Full name"
        autocomplete="name"
    >

    <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
    >

    <input
        id="confirm"
        type="password"
        placeholder="Confirm password"
        autocomplete="new-password"
    >

    <button id="registerButton">
        CREATE ACCOUNT
    </button>

    <div id="message" class="message"></div>

    <div
        class="link"
        onclick="window.location.href='login.html'"
    >
        Already have an account? Login
    </div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
    "https://plddteltleqayzcpuxom.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_jX6_GQggT_GD2Kv_jNBcqA_frXVuZWv";


const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const nameInput =
    document.getElementById("name");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const confirmInput =
    document.getElementById("confirm");

const button =
    document.getElementById("registerButton");

const message =
    document.getElementById("message");


button.addEventListener("click", async () => {

    const name =
        nameInput.value.trim();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    const confirm =
        confirmInput.value;


    message.textContent = "";
    message.className = "message";


    if (!name || !email || !password || !confirm) {

        message.textContent =
            "Please complete all fields.";

        message.className =
            "message error";

        return;
    }


    if (password.length < 6) {

        message.textContent =
            "Password must contain at least 6 characters.";

        message.className =
            "message error";

        return;
    }


    if (password !== confirm) {

        message.textContent =
            "Passwords do not match.";

        message.className =
            "message error";

        return;
    }


    button.disabled = true;

    button.textContent =
        "CREATING ACCOUNT...";


    try {

        const { error } =
            await supabase.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {
                        full_name: name
                    }

                }

            });


        if (error) {

            message.textContent =
                error.message;

            message.className =
                "message error";

            button.disabled = false;

            button.textContent =
                "CREATE ACCOUNT";

            return;
        }


        message.textContent =
            "Account created successfully.";

        message.className =
            "message success";


        setTimeout(() => {

            window.location.href =
                "login.html";

        }, 1500);


    } catch (error) {

        message.textContent =
            "Unable to create account. Please try again.";

        message.className =
            "message error";

        button.disabled = false;

        button.textContent =
            "CREATE ACCOUNT";

    }

});

</script>

</body>

</html>
